# API + HTTPS automático (Caddy). Uso:  cp .env.example .env  &&  docker compose up -d --build
services:
  api:
    build:
      context: ../../backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      TRUST_PROXY: "true"
    volumes:
      - storage:/app/storage        # boletines, consolidados, firmas, chat
      - uploads:/app/uploads        # fotos de perfil
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  storage:
  uploads:
  caddy_data:
  caddy_config:
